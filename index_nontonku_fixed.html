<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
let films=[];
const SUPABASE_URL='https://vsuwjokcqiruhbmmtabb.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_9rZvzp0sYjKsAFDsNCb75g_7DXYvuQ5';
const fallbackPoster='https://placehold.co/600x900/0b1628/9fbce9?text=NontonKu';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeUrl(s){try{const u=new URL(String(s||''),location.href);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function normalizeFilm(f){
 return {...f,year:f.release_year??f.year??'',poster_url:f.poster_path??f.poster_url??'',video_url:f.video_path??f.video_url??'',genre:f.genre??'Film lainnya'};
}
function render(){
 const q=$('search').value.trim().toLowerCase();
 const filtered=films.filter(f=>[f.title,f.genre,f.year].join(' ').toLowerCase().includes(q));
 const groups={};filtered.forEach(f=>(groups[f.genre||'Film lainnya']??=[]).push(f));
 const root=$('list');root.innerHTML='';
 if(!filtered.length){root.innerHTML='<div class="notice">'+(films.length?'Film tidak ditemukan.':'Belum ada film yang bisa ditampilkan. Periksa tabel films dan izin baca Supabase.')+'</div>';return}
 Object.entries(groups).forEach(([genre,arr])=>{
  const section=document.createElement('section');section.className='section';
  section.innerHTML='<h2>'+esc(genre)+'</h2><div class="row">'+arr.map(f=>'<article class="card" tabindex="0" role="button" data-id="'+esc(f.id)+'">'+(safeUrl(f.poster_url)?'<img class="poster" loading="lazy" src="'+esc(safeUrl(f.poster_url))+'" alt="'+esc(f.title)+'" onerror="this.onerror=null;this.src=\''+fallbackPoster+'\'">':'<img class="poster" src="'+fallbackPoster+'" alt="Poster belum tersedia">')+'<div class="title">'+esc(f.title)+'</div><div class="meta">'+esc([f.year,f.genre].filter(Boolean).join(' • '))+'</div></article>').join('')+'</div>';
  root.appendChild(section);
  section.querySelectorAll('.card').forEach(el=>{el.onclick=()=>play(el.dataset.id);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();play(el.dataset.id)}}});
 });
}
let adPlayerLoaded=false;
function loadPlayerAd(){
 if(adPlayerLoaded)return;adPlayerLoaded=true;
 const s=document.createElement('script');s.async=true;s.dataset.cfasync='false';
 s.src='https://pl31787885.profitableratecpmnetwork.com/ad51b057c7485f3c6a1992e15c154301/invoke.js';
 $('container-ad51b057c7485f3c6a1992e15c154301').appendChild(s);
}
function play(id){
 const f=films.find(x=>String(x.id)===String(id));if(!f)return;
 const u=safeUrl(f.video_url);$('filmTitle').textContent=f.title||'Film';
 $('filmMeta').textContent=[f.year,f.genre].filter(Boolean).join(' • ');
 $('player').innerHTML='';$('direct').hidden=!u;$('direct').href=u||'#';
 if(!u){$('player').textContent='Tautan video belum tersedia.'}
 else if(/iframe\.videodelivery\.net|youtube\.com\/embed|player\.vimeo\.com/i.test(u)){
  const x=document.createElement('iframe');x.src=u;x.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';x.allowFullscreen=true;$('player').appendChild(x);
 }else if(/\.(mp4|webm|ogg|m3u8)(\?|$)/i.test(u)){
  const x=document.createElement('video');x.src=u;x.controls=true;x.playsInline=true;$('player').appendChild(x);
 }else{const x=document.createElement('iframe');x.src=u;x.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';x.allowFullscreen=true;$('player').appendChild(x)}
 loadPlayerAd();$('modal').classList.add('open');document.body.style.overflow='hidden';
}
function close(){$('modal').classList.remove('open');$('player').innerHTML='';document.body.style.overflow=''}
$('close').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('search').addEventListener('input',render);
async function init(){
 if(!window.supabase){$('status').textContent='Pustaka Supabase gagal dimuat. Periksa koneksi internet atau CDN.';return}
 try{
  const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  // Cocok dengan struktur database dari HTML lama: release_year, poster_path, video_path, published.
  const {data,error}=await db.from('films').select('*').eq('published',true).order('created_at',{ascending:false});
  if(error)throw error;
  films=(data||[]).map(normalizeFilm).filter(f=>f.title);
  $('heroText').textContent=films.length?'Pilih poster untuk memutar film.':'Supabase terhubung, tetapi tidak ada film berstatus published=true.';
  if(films[0])$('heroTitle').textContent=films[0].title;
  $('status')?.remove();render();
 }catch(e){
  console.error('Supabase load error:',e);
  $('status').textContent='Gagal memuat film dari Supabase: '+(e.message||'Periksa izin SELECT/RLS, nama kolom, dan status published.');
 }
}
init();
})();
</script>
